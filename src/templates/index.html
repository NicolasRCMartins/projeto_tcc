<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de IA - Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .upload-container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="upload-container text-center">
            <h1 class="mb-4">🎨 Detector de Arte Humana vs IA</h1>
            <p class="text-muted">Envie uma imagem para descobrir se ela foi criada por um humano ou por Inteligência Artificial.</p>
            
            <form action="/predict" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="formFile" class="form-label">Selecione uma imagem (JPG, PNG)</label>
                    <input class="form-control" type="file" id="formFile" name="file" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Analisar Imagem</button>
            </form>
        </div>
    </div>
</body>
</html>
